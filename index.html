<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMAA - IoT Predictive AI</title>
    
    <!-- خطوط وتصميم -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- مكتبة الخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- الرسم البياني والذكاء الاصطناعي -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: #050912; color: #fff; overflow-x: hidden; }
        
        /* رأس الصفحة */
        .header { text-align: center; padding: 20px 0; background: linear-gradient(180deg, rgba(0, 255, 255, 0.1) 0%, transparent 100%); border-bottom: 1px solid rgba(0, 255, 255, 0.2); }
        .header h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 2px; color: #00ffff; text-shadow: 0 0 20px rgba(0, 255, 255, 0.5); }
        .header h1 i { color: #fff; text-shadow: none; }
        .header p { margin: 5px 0 0; font-size: 12px; opacity: 0.7; color: #a0c4ff; }

        /* لوحة التحكم الزجاجية */
        .dashboard { display: flex; justify-content: space-around; padding: 15px; gap: 10px; background: rgba(13, 27, 42, 0.5); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 255, 255, 0.1); }
        .dash-box { flex: 1; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 255, 255, 0.15); border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); transition: 0.3s; }
        .dash-box:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); border-color: #00ffff; }
        .dash-box h3 { margin: 0 0 5px 0; font-size: 11px; color: #8899aa; text-transform: uppercase; letter-spacing: 1px; }
        .dash-box .val { font-size: 22px; font-weight: 600; color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.2); }
        .dash-box .val.alert { color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.5); }
        .dash-box .val.success { color: #2ed573; }
        .dash-box .val.warning { color: #ffa502; }

        /* الخريطة (تم تعديلها لخلفية داكنة) */
        #map { height: 55vh; width: 100%; background: #0b1320; z-index: 1; border-bottom: 1px solid rgba(0, 255, 255, 0.1); }
        .leaflet-control-zoom { display: none; } /* إخفاء أزرار التكبير للحفاظ على التصميم */

        /* الرسم البياني */
        .chart-container { background: rgba(13, 27, 42, 0.6); backdrop-filter: blur(5px); margin: 15px; border-radius: 15px; padding: 15px; border: 1px solid rgba(0, 255, 255, 0.1); box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .chart-container h3 { text-align: center; margin: 0 0 10px 0; color: #00ffff; font-size: 14px; letter-spacing: 1px; }
        #predictionChart { height: 110px !important; width: 100% !important; }

        /* شريط الحالة */
        .status { position: absolute; bottom: 20px; left: 20px; background: rgba(0, 255, 255, 0.1); backdrop-filter: blur(5px); border: 1px solid rgba(0, 255, 255, 0.3); padding: 8px 15px; border-radius: 20px; z-index: 1000; font-size: 11px; color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.1); }

        @media (max-width: 600px) { .header h1 { font-size: 18px; } .dash-box .val { font-size: 16px; } .dash-box h3 { font-size: 9px; } }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-globe"></i> ASMAA <span style="font-weight:300; color:#fff;">|</span> <i class="fas fa-microchip"></i> AI NEURAL</h1>
        <p>نظام توقع الازدحام الشبكي باستخدام إنترنت الأشياء</p>
    </div>
    
    <div class="dashboard">
        <div class="dash-box"><h3><i class="fas fa-exclamation-triangle" style="color:#ff4757;"></i> أعلى ولاية</h3><div class="val alert" id="alert-city">جاري...</div></div>
        <div class="dash-box"><h3><i class="fas fa-signal" style="color:#00ffff;"></i> متوسط الازدحام</h3><div class="val" id="avg-load">0%</div></div>
        <div class="dash-box"><h3><i class="fas fa-brain" style="color:#ffa502;"></i> توقع LSTM</h3><div class="val warning" id="trend-direction">يتعلم...</div></div>
    </div>

    <div id="map"></div>

    <div class="chart-container">
        <h3><i class="fas fa-chart-line" style="color:#00ffff;"></i> توقع الشبكة العصبية (Live)</h3>
        <canvas id="predictionChart"></canvas>
    </div>

    <div class="status" id="status"><i class="fas fa-circle" style="color:#00ffff; font-size: 8px; margin-left:5px;"></i> جاري تشغيل أنظمة ASMAA...</div>

    <script>
        // 1. ** إعداد الخريطة الليلية (Dark Mode) **
        var map = L.map('map', { zoomControl: false }).setView([34.0, 2.5], 6);
        // استخدم طبقة خرائط داكنة (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        const cities = [
            { "name": "الجزائر", "lat": 36.75, "lon": 3.04, "weight": 1.0 },
            { "name": "وهران", "lat": 35.68, "lon": -0.63, "weight": 0.8 },
            { "name": "قسنطينة", "lat": 36.36, "lon": 6.61, "weight": 0.7 },
            { "name": "البيض", "lat": 33.68, "lon": 1.02, "weight": 0.7 }
        ];
        var heatLayer = L.heatLayer([], { radius: 45, blur: 25, maxZoom: 12, minOpacity: 0.5 }).addTo(map);

        // 2. ** إعداد الرسم البياني الداكن **
        const ctx = document.getElementById('predictionChart').getContext('2d');
        let historyLoad = [50, 55, 60, 65, 58, 62];
        const predictionChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['-15د', '-12د', '-9د', '-6د', '-3د', 'الآن', '+3د', '+6د', '+9د', '+12د', '+15د'],
                datasets: [{
                    label: 'الازدحام المتوقع',
                    data: [...historyLoad, 0, 0, 0, 0, 0],
                    borderColor: '#00ffff',
                    backgroundColor: 'rgba(0, 255, 255, 0.1)',
                    borderWidth: 3,
                    pointBackgroundColor: '#00ffff',
                    pointRadius: 3,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8899aa' } }, x: { grid: { display: false }, ticks: { color: '#8899aa' } } } }
        });

        // 3. ** بناء نموذج LSTM الذكي **
        let lstmModel;
        async function createModel() {
            lstmModel = tf.sequential();
            lstmModel.add(tf.layers.lstm({units: 10, inputShape: [5, 1], activation: 'relu'}));
            lstmModel.add(tf.layers.dense({units: 1}));
            lstmModel.compile({optimizer: 'adam', loss: 'meanSquaredError'});
            const xs = tf.tensor2d([[0.5, 0.6, 0.7, 0.8, 0.9], [0.4, 0.5, 0.6, 0.7, 0.8]]).reshape([2, 5, 1]);
            const ys = tf.tensor2d([[1.0], [0.9]]);
            await lstmModel.fit(xs, ys, {epochs: 1, verbose: 0});
            document.getElementById('status').innerHTML = '<i class="fas fa-check-circle"></i> نموذج AI جاهز للتنبؤ';
        }
        createModel();

        // 4. ** تحديث المحاكاة **
        async function updateSimulation() {
            let points = []; let cityLoads = []; let activePoints = 0;
            cities.forEach(city => {
                let sine_val = Math.sin(Date.now() / 25000 + city.weight);
                let intensity = Math.max(0.1, (sine_val + 1) / 2) * city.weight;
                let num_points = Math.floor(intensity * 180) + 20;
                activePoints += num_points;
                cityLoads.push({ name: city.name, load: Math.round(intensity * 100) });
                for (let i = 0; i < num_points; i++) {
                    points.push([city.lat + (Math.random()-0.5)*0.06*intensity, city.lon + (Math.random()-0.5)*0.06*intensity, intensity]);
                }
            });
            heatLayer.setLatLngs(points);
            
            let avgLoad = Math.round(cityLoads.reduce((a, c) => a + c.load, 0) / cityLoads.length);
            let maxCity = cityLoads.reduce((max, c) => c.load > max.load ? c : max, cityLoads[0]);
            
            document.getElementById('avg-load').innerText = avgLoad + '%';
            document.getElementById('alert-city').innerText = maxCity.name;

            historyLoad.push(avgLoad);
            if(historyLoad.length > 6) historyLoad.shift();

            let newData = [...historyLoad];
            
            if (lstmModel) {
                const inputTensor = tf.tensor2d([historyLoad], [1, 5, 1]);
                const predictionTensor = lstmModel.predict(inputTensor);
                let predictedVal = predictionTensor.dataSync()[0];
                predictedVal = Math.min(100, Math.max(0, Math.round(predictedVal * 100)));

                let tempHist = [...historyLoad];
                for(let i=1; i<=5; i++) {
                    let inp = tf.tensor2d([tempHist.slice(-5)], [1, 5, 1]);
                    let pred = lstmModel.predict(inp).dataSync()[0];
                    let val = Math.min(100, Math.max(0, Math.round(pred * 100)));
                    newData.push(val);
                    tempHist.push(val);
                }

                let trend = newData[newData.length-1] - newData[newData.length-6];
                let trendEl = document.getElementById('trend-direction');
                if(trend > 3) { trendEl.innerHTML = '<i class="fas fa-arrow-up"></i> ازدحام صاعد'; trendEl.style.color = '#ff4757'; }
                else if(trend < -3) { trendEl.innerHTML = '<i class="fas fa-arrow-down"></i> ازدحام منخفض'; trendEl.style.color = '#2ed573'; }
                else { trendEl.innerHTML = '<i class="fas fa-minus"></i> مستقر'; trendEl.style.color = '#ffa502'; }
            }

            predictionChart.data.datasets[0].data = newData;
            predictionChart.update();
        }
        updateSimulation();
        setInterval(updateSimulation, 4000);
    </script>
</body>
</html>
