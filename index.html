<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMAA - الذكاء العصبي للتنبؤ (AI LSTM)</title>
    <!-- مكتبة الخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <!-- Chart.js للرسم البياني -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 🧠 إضافة TensorFlow.js (الذكاء الاصطناعي يعمل مباشرة في المتصفح) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #f8f9fa; }
        #map { height: 50vh; width: 100%; }
        .header { background: #1a2639; color: white; padding: 15px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }
        .dashboard { background: white; padding: 15px; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #e9ecef; }
        .dash-box { background: #f1f3f5; padding: 10px 15px; border-radius: 8px; text-align: center; flex: 1; min-width: 120px; }
        .dash-box .val { font-size: 18px; font-weight: bold; color: #1a2639; }
        .alert { color: #dc3545 !important; }
        .chart-container { background: white; padding: 15px; margin-top: 5px; border-top: 1px solid #eee; }
        .chart-container h3 { text-align: center; margin: 0 0 10px 0; color: #555; font-size: 16px; }
        #predictionChart { height: 120px !important; width: 100% !important; }
        .status { position: absolute; bottom: 20px; left: 20px; background: white; padding: 8px 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; border-right: 4px solid #1a2639; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header"><h1>🧠 ASMAA - الذكاء الاصطناعي العصبي للشبكة</h1></div>
    
    <div class="dashboard">
        <div class="dash-box"><h3>⚠️ أعلى ولاية خطورة</h3><div class="val alert" id="alert-city">جاري...</div></div>
        <div class="dash-box"><h3>📶 متوسط الازدحام</h3><div class="val" id="avg-load">0%</div></div>
        <div class="dash-box"><h3>🤖 توقع LSTM (15 د)</h3><div class="val" id="trend-direction">يتعلم...</div></div>
    </div>

    <div id="map"></div>

    <div class="chart-container">
        <h3>📉 تنبؤ الشبكة العصبية المستقبلية (LSTM Live)</h3>
        <canvas id="predictionChart"></canvas>
    </div>

    <div class="status" id="status">جاري تحميل النموذج العصبي...</div>

    <script>
        var map = L.map('map').setView([34.0, 2.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        const cities = [
            { "name": "الجزائر", "lat": 36.75, "lon": 3.04, "weight": 1.0 },
            { "name": "وهران", "lat": 35.68, "lon": -0.63, "weight": 0.8 },
            { "name": "قسنطينة", "lat": 36.36, "lon": 6.61, "weight": 0.7 },
            { "name": "البيض", "lat": 33.68, "lon": 1.02, "weight": 0.7 }
        ];
        var heatLayer = L.heatLayer([], { radius: 45, blur: 30, maxZoom: 12 }).addTo(map);

        // إعداد الرسم البياني
        const ctx = document.getElementById('predictionChart').getContext('2d');
        let historyLoad = [50, 55, 60, 65, 58, 62];
        const predictionChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['-15د', '-12د', '-9د', '-6د', '-3د', 'الآن', '+3د', '+6د', '+9د', '+12د', '+15د'],
                datasets: [{
                    label: 'الازدحام المتوقع (AI LSTM)',
                    data: [...historyLoad, 0, 0, 0, 0, 0],
                    borderColor: '#28a745',
                    backgroundColor: 'rgba(40, 167, 69, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } }
        });

        // 🧠 بناء نموذج LSTM باستخدام TensorFlow.js داخل المتصفح
        let lstmModel;

        async function createModel() {
            lstmModel = tf.sequential();
            lstmModel.add(tf.layers.lstm({units: 10, inputShape: [5, 1], activation: 'relu'}));
            lstmModel.add(tf.layers.dense({units: 1}));
            lstmModel.compile({optimizer: 'adam', loss: 'meanSquaredError'});
            
            // تدريب النموذج وهمياً لمرة واحدة لإعداده (معدل خطأ صغير)
            const xs = tf.tensor2d([[0.5, 0.6, 0.7, 0.8, 0.9], [0.4, 0.5, 0.6, 0.7, 0.8]]).reshape([2, 5, 1]);
            const ys = tf.tensor2d([[1.0], [0.9]]);
            await lstmModel.fit(xs, ys, {epochs: 1, verbose: 0});
            document.getElementById('status').innerHTML = "🧠 نموذج LSTM جاهز للتنبؤ";
        }

        // استدعاء دالة بناء النموذج
        createModel();

        // دالة التحديث الرئيسية
        async function updateSimulation() {
            let points = []; let cityLoads = []; let activePoints = 0;
            cities.forEach(city => {
                let sine_val = Math.sin(Date.now() / 25000 + city.weight);
                let intensity = Math.max(0.1, (sine_val + 1) / 2) * city.weight;
                let num_points = Math.floor(intensity * 180) + 20;
                activePoints += num_points;
                cityLoads.push({ name: city.name, load: Math.round(intensity * 100) });
                for (let i = 0; i < num_points; i++) {
                    points.push([city.lat + (Math.random()-0.5)*0.06*intensity, city.lon + (Math.random()-0.5)*0.06*intensity, intensity]);
                }
            });
            heatLayer.setLatLngs(points);
            
            let avgLoad = Math.round(cityLoads.reduce((a, c) => a + c.load, 0) / cityLoads.length);
            let maxCity = cityLoads.reduce((max, c) => c.load > max.load ? c : max, cityLoads[0]);
            
            document.getElementById('avg-load').innerText = avgLoad + '%';
            document.getElementById('alert-city').innerText = maxCity.name;
            document.getElementById('status').innerHTML = `🧠 نقاط ASMAA النشطة: ${activePoints}`;

            // تحديث سجل البيانات
            historyLoad.push(avgLoad);
            if(historyLoad.length > 6) historyLoad.shift();

            let newData = [...historyLoad];
            
            // 🧠 استخدام الذكاء الاصطناعي (TensorFlow) للتنبؤ بالـ 15 دقيقة القادمة
            if (lstmModel) {
                // تحويل البيانات إلى Tensor
                const inputTensor = tf.tensor2d([historyLoad], [1, 5, 1]);
                // التنبؤ
                const predictionTensor = lstmModel.predict(inputTensor);
                // جلب القيمة المتوقعة
                let predictedVal = predictionTensor.dataSync()[0];
                predictedVal = Math.min(100, Math.max(0, Math.round(predictedVal * 100)));

                // تكرار التنبؤ لتعبئة الرسم البياني (محاكاة بسيطة لخط التنبؤ)
                let tempHist = [...historyLoad];
                for(let i=1; i<=5; i++) {
                    let inp = tf.tensor2d([tempHist.slice(-5)], [1, 5, 1]);
                    let pred = lstmModel.predict(inp).dataSync()[0];
                    let val = Math.min(100, Math.max(0, Math.round(pred * 100)));
                    newData.push(val);
                    tempHist.push(val);
                }

                // تحديد اتجاه التنبؤ
                let trend = newData[newData.length-1] - newData[newData.length-6];
                let trendEl = document.getElementById('trend-direction');
                if(trend > 3) { trendEl.innerText = '🚨 ازدحام صاعد (LSTM)'; trendEl.style.color = '#dc3545'; }
                else if(trend < -3) { trendEl.innerText = '✅ ازدحام منخفض (LSTM)'; trendEl.style.color = '#198754'; }
                else { trendEl.innerText = '⏸️ مستقر (LSTM)'; trendEl.style.color = '#ffc107'; }
            }

            predictionChart.data.datasets[0].data = newData;
            predictionChart.update();
        }
        updateSimulation();
        setInterval(updateSimulation, 4000);
    </script>
</body>
</html>
